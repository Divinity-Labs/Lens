    post:
      operationId: settlePayment
      summary: Settle an x402 payment (idempotent)
      description: >-
        Submits the payment transaction and records the attempt keyed on its
        transaction hash. Retrying the same payload replays the stored answer
        instead of paying twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleRequest'
            example:
              x402Version: 1
              paymentPayload:
                x402Version: 1
                scheme: exact
                network: stellar:testnet
              paymentRequirements:
                scheme: exact
                network: stellar:testnet
                maxAmountRequired: '10000'
                asset: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                payTo: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                maxTimeoutSeconds: 300
              captured: '2026-10-16'
      responses:
        '200':
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
              example:
                success: true
                transaction: 9f2c4a6b8d0e1f3a5c7d9e0b2a4c6d8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d
                network: stellar:testnet
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /graphql:
    get:
      operationId: graphqlGet
      summary: Execute a GraphQL query over HTTP GET
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          example: '{ getPrice(assetA: "XLM", assetB: "USDC") { pairKey price } }'
        - name: variables
          in: query
          required: false
          description: JSON-encoded variables object.
          schema:
            type: string
        - name: operationName
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: GraphQL result
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlResponse'
              example:
                data:
                  getPrice:
                    pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                    price: 0.11906825
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: graphqlPost
      summary: Execute a GraphQL query, mutation or subscription handshake
      security:
        - x402: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                variables:
                  type: object
                operationName:
                  type: string
            example:
              query: '{ getPrice(assetA: "XLM", assetB: "USDC") { pairKey price } }'
              captured: '2026-10-16'
      responses:
        '200':
          description: GraphQL result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQlResponse'
              example:
                data:
                  getPrice:
                    pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                    price: 0.11906825
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    x402:
      type: apiKey
      name: X-PAYMENT
      in: header
      description: Base64 encoded JSON payment proof for x402 micropayments.
    adminAuth:
      type: apiKey
      name: X-Admin-Key
      in: header
    apiKeyAuth:
      type: http
      scheme: bearer
      description: >-
        Client API key issued through the admin API, sent as
        `Authorization: Bearer <key>`.

  parameters:
    NetworkQuery:
      name: network
      in: query
      required: false
      description: >-
        Stellar network to answer for — `testnet` or `mainnet`. Defaults to
        this instance's configured `STELLAR_NETWORK`. An unrecognised value is
        rejected with 400. DB-backed reads are currently served from whichever
        network this instance indexes, even when another is requested.
      schema:
        type: string
        enum: [testnet, mainnet]
        default: testnet

  responses:
    BadRequest:
      description: Bad request — the error body names the offending parameter and carries a machine-readable code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'window must be one of: 1m, 5m, 1h, 24h'
            code: invalid_window
            captured: '2026-10-16'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Unauthorized'
            message: 'Missing API key. Provide an Authorization: Bearer <key> header.'
            code: missing_api_key
            captured: '2026-10-16'
    NotFound:
      description: No data for the requested pair or asset on this network
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Pair XLM/FOO not watched on testnet
            code: pair_not_watched
            captured: '2026-10-16'
    Conflict:
      description: The resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Pair USDC/XLM is already being watched
            code: pair_exists
            captured: '2026-10-16'
    PaymentRequired:
      description: Payment Required
      content:
        application/json:
          schema:
            type: object
            properties:
              x402Version:
                type: integer
              accepts:
                type: array
                items:
                  type: object
                  properties:
                    scheme:
                      type: string
                    price:
                      type: string
                    network:
                      type: string
                    payTo:
                      type: string
              error:
                type: string
              description:
                type: string
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
              error:
                type: string
              message:
                type: string
              retryAfter:
                type: string
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error
            code: internal_error
            captured: '2026-10-16'

  headers:
    CacheControl:
      description: >-
        Per-route cache policy (see "Cache policy" in the API description).
        Every route sends a deliberate `Cache-Control`: live prices
        `public, max-age=30`; aggregates `public, max-age=60`; `/pairs` and
        `/pools` `public, max-age=300`; closed candle windows
        `public, max-age=86400`; per-caller, operator and error responses
        `no-store`.
      schema:
        type: string
        example: 'public, max-age=300'

  schemas:
    Error:
      type: object
      description: Shared error envelope returned by every non-2xx JSON response
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable reason; the `code` below is the stable contract
          example: Pair XLM/FOO not watched on testnet
        message:
          type: string
          description: Optional extra detail (auth failures, validation hints)
          example: 'Missing API key. Provide an Authorization: Bearer <key> header.'
        code:
          type: string
          description: >-
            Stable machine-readable code a generated client can branch on:
            invalid_network | invalid_window | invalid_interval | invalid_amount |
            invalid_limit | invalid_cursor | invalid_sort | invalid_filter |
            invalid_format | invalid_date | window_too_large | invalid_asset |
            invalid_threshold | invalid_url | pair_not_watched | pair_exists |
            asset_not_found | missing_api_key | invalid_api_key | quota_exceeded |
            rate_limited | payment_required | payment_invalid | internal_error
          example: pair_not_watched
        captured:
          type: string
          description: Date the documented example was captured (YYYY-MM-DD)
          example: '2026-10-16'
    Asset:
      type: object
      properties:
        code:
          type: string
        issuer:
          type: string
          nullable: true

    SnapshotAsset:
      type: object
      description: >-
        A Stellar asset. The issuer is kept because a code such as USDC names a
        different asset per issuer; `issuer` is null only for the native asset.
      properties:
        code:
          type: string
        issuer:
          type: string
          nullable: true

    SnapshotVenue:
      type: object
      properties:
        name:
          type: string
        source:
          type: string
        type:
          type: string
          enum: [orderbook, amm, unknown]
        enabled:
          type: boolean
          nullable: true
        status:
          type: string
          enum: [reporting, stale, silent, disabled]
        samples:
          type: integer
        samples24h:
          type: integer
        pairs24h:
          type: integer
        lastUpdated:
          type: string
          format: date-time
          nullable: true
        ageSeconds:
          type: integer
          nullable: true

    SnapshotPool:
      type: object
      properties:
        poolId:
          type: string
        pairKey:
          type: string
          nullable: true
        assetA:
          $ref: '#/components/schemas/SnapshotAsset'
        assetB:
          $ref: '#/components/schemas/SnapshotAsset'
        reserveA:
          type: number
          nullable: true
        reserveB:
          type: number
          nullable: true
        spotPrice:
          type: number
          nullable: true
        feeBp:
          type: integer
          nullable: true
        lastUpdated:
          type: string
          format: date-time
          nullable: true
        ageSeconds:
          type: integer
          nullable: true

    SnapshotVolume:
      type: object
      properties:
        value:
          type: number
          nullable: true
        unit:
          allOf:
            - $ref: '#/components/schemas/SnapshotAsset'
          nullable: true
        reason:
          type: string
          nullable: true

    SnapshotTopPair:
      type: object
      properties:
        pairKey:
          type: string
        configured:
          type: boolean
          description: >-
            Whether the pair is in this network's watched-pair config. When
            false the asset order (and therefore the price direction) is taken
            from the alphabetically-sorted pair key.
        assetA:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SnapshotAsset'
        assetB:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SnapshotAsset'
        price:
          type: number
          nullable: true
          description: Stored as assetB-per-assetA in the config's order.
        baseVolume24h:
          type: number
        counterVolume24h:
          type: number
        samples24h:
          type: integer
        venues:
          type: array
          items:
            type: string
        lastUpdated:
          type: string
          format: date-time
          nullable: true
        ageSeconds:
          type: integer
          nullable: true

    SnapshotPeg:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/SnapshotAsset'
        target:
          type: string
        pairKey:
          type: string
        quote:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SnapshotAsset'
        price:
          type: number
          nullable: true
          description: The pegged asset's price in its quote asset.
        deviationBp:
          type: number
          nullable: true
        status:
          type: string
          enum: [on_peg, off_peg, no_reference, no_data]
        reason:
          type: string
          nullable: true
        samples24h:
          type: integer
        lastUpdated:
          type: string
          format: date-time
          nullable: true

    SnapshotResponse:
      type: object
      properties:
        network:
          type: string
          enum: [testnet, mainnet]
        asOf:
          type: string
          format: date-time
          description: The single instant (from one database statement) every window and age is measured from.
        generatedAt:
          type: string
          format: date-time
        window:
          type: string
          enum: ['24h']
        cache:
          type: object
          properties:
            ttlSeconds:
              type: integer
            maxAgeSeconds:
              type: integer
            hit:
              type: boolean
            storedAt:
              type: string
              format: date-time
            ageSeconds:
              type: integer
              nullable: true
        venues:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotVenue'
        tvl:
          type: object
          properties:
            note:
              type: string
            poolCount:
              type: integer
            sampleCount:
              type: integer
            lastUpdated:
              type: string
              format: date-time
              nullable: true
            ageSeconds:
              type: integer
              nullable: true
            stale:
              type: boolean
            byAsset:
              type: array
              items:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/SnapshotAsset'
                  amount:
                    type: number
                  pools:
                    type: integer
            pools:
              type: array
              items:
                $ref: '#/components/schemas/SnapshotPool'
        volume24h:
          type: object
          properties:
            window:
              type: string
              enum: ['24h']
            sampleCount:
              type: integer
            byVenue:
              type: array
              items:
                type: object
                properties:
                  venue:
                    type: string
                  baseVolume:
                    type: number
                  counterVolume:
                    type: number
                  samples:
                    type: integer
                  pairs:
                    type: integer
                  lastUpdated:
                    type: string
                    format: date-time
                    nullable: true
                  ageSeconds:
                    type: integer
                    nullable: true
            total:
              $ref: '#/components/schemas/SnapshotVolume'
        topPairs:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotTopPair'
        pegs:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPeg'
        freshness:
          type: object
          properties:
            asOf:
              type: string
              format: date-time
            windowStart:
              type: string
              format: date-time
            windowEnd:
              type: string
              format: date-time
            lastUpdated:
              type: string
              format: date-time
              nullable: true
            ageSeconds:
              type: integer
              nullable: true
            staleAfterSeconds:
              type: integer
            stale:
              type: boolean
            venuesReporting:
              type: integer
            venuesExpected:
              type: integer
            venuesSilent:
              type: integer

    AggregatedPrice:
      type: object
      properties:
        assetA:
          type: string
        assetB:
          type: string
        pairKey:
          type: string
        price:
          type: number
        sdexPrice:
          type: number
        ammPrice:
          type: number
        bestRoute:
          type: string
          enum: [SDEX, AMM, SPLIT, UNKNOWN]
        volume24h:
          type: number
        sdexVolume24h:
          type: number
        ammVolume24h:
          type: number
        vwap1m:
          type: number
        vwap5m:
          type: number
        vwap1h:
          type: number
        vwap24h:
          type: number
        priceChange24h:
          type: number
        lastUpdated:
          type: string
          format: date-time
        sources:
          type: integer
        confidence:
          type: string
          enum: [high, medium, low, unknown]
        lastTradeAgeSeconds:
          type: integer
          nullable: true

    RouteInfo:
      type: object
      properties:
        route:
          type: string
          enum: [SDEX, AMM, SPLIT, UNKNOWN]
        sdexPrice:
          type: number
        ammPrice:
          type: number
        estimatedOutput:
          type: number
        slippagePct:
          type: number
        recommendation:
          type: string

    PriceBucket:
      type: object
      properties:
        bucket:
          type: string
          format: date-time
        window:
          type: string
        vwap:
          type: number
        sdexVwap:
          type: number
          nullable: true
        ammVwap:
          type: number
          nullable: true
        volume:
          type: number
        tradeCount:
          type: integer
        open:
          type: number
          nullable: true
        close:
          type: number
          nullable: true
        high:
          type: number
          nullable: true
        low:
          type: number
          nullable: true

    PriceLevel:
      type: object
      required: [price, size]
      additionalProperties: false
      properties:
        price:
          type: number
        size:
          type: number

    DepthResponse:
      type: object
      required: [assetA, assetB, pairKey, spotPrice, executionPrice, slippagePct, asks, bids, source]
      additionalProperties: false
      properties:
        assetA:
          type: string
        assetB:
          type: string
        pairKey:
          type: string
        spotPrice:
          type: number
        executionPrice:
          type: number
        slippagePct:
          type: number
        asks:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
        bids:
          type: array
          items:
            $ref: '#/components/schemas/PriceLevel'
        source:
          type: string
          enum: [AMM, SDEX, BOTH]

    BookLevel:
      type: object
      required: [price, size, cumulativeSize, venues, synthetic, sampleCount]
      additionalProperties: false
      properties:
        price:
          type: number
          description: Quote-asset units per base-asset unit.
        size:
          type: number
          description: Base-asset size at this level.
        cumulativeSize:
          type: number
          description: Base-asset size from the best price through this level, independently for asks and bids.
        venues:
          type: array
          items:
            type: string
          description: SDEX for order-book levels or AMM:{poolId} for each contributing pool.
        synthetic:
          type: boolean
          description: True for reserve-derived AMM steps; false for observed SDEX book levels.
        sampleCount:
          type: integer
          description: Number of source levels combined at this price.

    BookSource:
      type: object
      required: [venue, status, sampleCount, observedAt, dataAgeSeconds, truncated]
      additionalProperties: false
      properties:
        venue:
          type: string
        status:
          type: string
          enum: [available, no_liquidity, unavailable]
        sampleCount:
          type: integer
          description: SDEX book levels returned, or latest AMM pool snapshots used.
        observedAt:
          type: string
          format: date-time
          nullable: true
        dataAgeSeconds:
          type: number
          nullable: true
        truncated:
          type: boolean
          description: True when the SDEX response reached the 200-level per-side request limit.

    BookResponse:
      type: object
      required: [assetA, assetB, pairKey, network, spotPrice, spotSource, depth, step, status, asks, bids, provenance]
      additionalProperties: false
      properties:
        assetA:
          type: string
        assetB:
          type: string
        pairKey:
          type: string
        network:
          type: string
          enum: [testnet, mainnet]
        spotPrice:
          type: number
          nullable: true
        spotSource:
          type: string
          nullable: true
          enum: [SDEX_MID, SDEX_ASK, SDEX_BID, AMM_RESERVES, null]
        depth:
          type: number
        step:
          type: number
        status:
          type: string
          enum: [ok, partial, no_liquidity, no_levels_in_range, unavailable]
        asks:
          type: array
          items:
            $ref: '#/components/schemas/BookLevel'
        bids:
          type: array
          items:
            $ref: '#/components/schemas/BookLevel'
        provenance:
          type: object
          required: [sampledAt, sampleCount, venues]
          additionalProperties: false
          properties:
            sampledAt:
              type: string
              format: date-time
            sampleCount:
              type: integer
            venues:
              type: array
              items:
                $ref: '#/components/schemas/BookSource'

    TwapResponse:
      type: object
      required: [assetA, assetB, pairKey, network, twap, windowMinutes, sampleIntervalSeconds, startTime, endTime, sampleCount, outlierRejected, filterMethod]
      additionalProperties: false
      properties:
        assetA:
          type: string
        assetB:
          type: string
        pairKey:
          type: string
        network:
          type: string
          enum: [testnet, mainnet]
        twap:
          type: number
        windowMinutes:
          type: integer
        sampleIntervalSeconds:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        sampleCount:
          type: integer
        outlierRejected:
          type: integer
        filterMethod:
          type: string
          enum: [iqr, modified_zscore]

    VwapResponse:
      type: object
      required: [assetA, assetB, pairKey, vwap, windowMinutes, source, startTime, endTime, sampleCount, volumeTotal, outlierRejected, filterMethod]
      additionalProperties: false
      properties:
        assetA:
          type: string
        assetB:
          type: string
        pairKey:
          type: string
        vwap:
          type: number
        windowMinutes:
          type: integer
        source:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        sampleCount:
          type: integer
        volumeTotal:
          type: number
        outlierRejected:
          type: integer
        filterMethod:
          type: string
          enum: [iqr, modified_zscore]

    VolumeResponse:
      type: object
      required: [asset, window, startTime, endTime, totalVolume, byVenue, venues, tradeCount]
      additionalProperties: false
      properties:
        asset:
          type: string
        window:
          type: string
          enum: [24h, 7d, 30d]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalVolume:
          type: number
        byVenue:
          type: object
          additionalProperties:
            type: number
        venues:
          type: array
          items:
            type: string
        tradeCount:
          type: integer

    SpreadVenue:
      type: object
      required: [venue, pairKey, bid, ask, mid, spreadBps, observations, lastSeen]
      additionalProperties: false
      properties:
        venue:
          type: string
        pairKey:
          type: string
        bid:
          type: number
        ask:
          type: number
        mid:
          type: number
        spreadBps:
          type: number
        observations:
          type: integer
        lastSeen:
          type: string
          format: date-time

    SpreadResponse:
      type: object
      required: [asset, network, window, startTime, endTime, venues, tightest]
      additionalProperties: false
      properties:
        asset:
          type: string
        network:
          type: string
          enum: [testnet, mainnet]
        window:
          type: string
          enum: [5m, 15m, 1h, 24h]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        venues:
          type: array
          items:
            $ref: '#/components/schemas/SpreadVenue'
        tightest:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpreadVenue'

    CompareResponse:
      type: object
      required: [asset, network, lens, reflector, deviationPct, status, fetchedAt, oracles]
      additionalProperties: false
      properties:
        asset:
          type: string
        network:
          type: string
          enum: [testnet, mainnet]
        lens:
          type: number
          nullable: true
        reflector:
          type: number
          nullable: true
        deviationPct:
          type: number
          nullable: true
        status:
          type: string
          enum: [aligned, minor_deviation, major_deviation, partial]
        fetchedAt:
          type: string
          format: date-time
        oracles:
          type: array
          description: One result per configured adapter; unavailable sources remain present with a status.
          items:
            type: object
            required: [name, price, timestamp, deviationPct, status, ageSeconds]
            additionalProperties: false
            properties:
              name:
                type: string
              price:
