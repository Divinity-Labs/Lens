openapi: 3.0.0
info:
  title: Lens API
  description: >-
    Unified Stellar price API aggregating SDEX + AMM prices.

    Cache policy: every route sends a deliberate `Cache-Control` response
    header. Live prices (`/price/*`) are `public, max-age=30`; aggregates
    (`/price/*/history`, `/price/twap/*`, `/price/vwap/*`, `/prices/history`,
    `/compare/*`, `/spreads/*`) are `public, max-age=60`; slower-moving views
    (`/volumes/*`, `/screener`, `/basket`) are `public, max-age=120`;
    reference data that changes rarely (`/pairs`, `/pools`, `/benchmark/*`)
    is `public, max-age=300`; the discovery document is
    `public, max-age=3600`. `/candles` for a closed historical window (its
    `to` at least one full interval in the past) is *probably* immutable —
    backfill can rewrite history — so it is
    `public, max-age=3600, stale-while-revalidate=86400`; the still-forming
    window is `public, max-age=60`. Every `public` response also sends
    `Vary: x-network`, because the Stellar network can come from the
    `x-network` header (not part of the URL cache key). Routes behind the
    x402 payment gate use `private` instead of `public` when x402 is
    configured, so a shared cache never serves paid content for free.
    Per-caller responses (`/usage/me`), operator routes
    (`/admin/*`), mutations and error responses are `no-store` and must never
    sit in a shared cache.

    Data Quality Guarantees: see `docs/data-quality.md` for explicit SLAs
    and guarantees on freshness (e.g. 300s staleness bound), completeness,
    precision (PostgreSQL Decimal(36,18) and negotiated string serialization),
    and multi-venue coverage across SDEX, Stellar AMM, Soroswap, and Aquarius.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000
    description: Local development server

paths:
  /venues/registry:
    get:
      operationId: getVenueRegistry
      summary: List registered venues and their network liveness
      description: Returns each registered venue adapter for the selected network. Liveness is based on recent price writes where available; on-demand adapters without persisted price points report unknown.
      security: []
      parameters:
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Registered venues and their current liveness
          content:
            application/json:
              schema:
                type: object
                required: [network, venues]
                properties:
                  network:
                    type: string
                    enum: [testnet, mainnet]
                  venues:
                    type: array
                    items:
                      type: object
                      required: [id, kind, network, enabled, liveness, lastSeenAt]
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                          enum: [orderbook, amm, oracle]
                        network:
                          type: string
                          enum: [testnet, mainnet]
                        enabled:
                          type: boolean
                        liveness:
                          type: string
                          enum: [live, stale, disabled, unknown]
                        lastSeenAt:
                          type: string
                          format: date-time
                          nullable: true

  /live:
    get:
      operationId: getLive
      summary: Liveness probe
      description: >-
        Reports whether this process is wedged and needs to be restarted. It
        checks no dependencies by design: a process that cannot reach Postgres
        is still healthy and should keep running, so failing liveness during a
        database outage would restart every instance at once. Use `/ready` to
        decide whether to send traffic.
      security: []
      responses:
        '200':
          description: Process is alive.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [ok, uptimeSeconds]
                properties:
                  ok:
                    type: boolean
                    example: true
                  uptimeSeconds:
                    type: integer
                    description: Seconds since the process started.
                    example: 3600

  /ready:
    get:
      operationId: getReady
      summary: Readiness probe
      description: >-
        Reports whether this process should receive traffic yet. Unhealthy
        until the boot sequence finishes — the server starts listening before
        the ingesters and background workers are running — and while Postgres
        is unreachable or unmigrated, or Redis is unreachable when Redis is
        part of readiness (`READINESS_REDIS_CHECK`, default true).

        A probe timeout is reported as `down`, and answers are cached briefly,
        so this is cheap to poll every few seconds. `/live` stays healthy
        throughout: a starting instance should be held out of rotation, not
        killed.
      security: []
      responses:
        '200':
          description: Ready to receive traffic.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
        '503':
          description: >-
            Not ready. `ok` is false and `checks` says which dependency (or the
            boot sequence) is responsible. `/live` remains healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'

  /status:
    get:
      operationId: getStatus
      summary: Get API status and indexer state
      security: []
      parameters:
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: API status
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  network:
                    type: string
                    enum: [testnet, mainnet]
                  watchedPairs:
                    type: array
                    items:
                      type: string
                  lastIndexedLedger:
                    type: integer
                    nullable: true
                  lastProcessedAt:
                    type: string
                    format: date-time
                    nullable: true
                  ingestLagSeconds:
                    type: integer
                    nullable: true
              example:
                ok: true
                network: testnet
                watchedPairs:
                  - USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                lastIndexedLedger: 50000200
                lastProcessedAt: '2026-10-16T00:00:00.000Z'
                ingestLagSeconds: 12
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /snapshot:
    get:
      operationId: getSnapshot
      summary: Whole-network snapshot (venues, TVL, 24h volume, top pairs, pegs, freshness)
      description: >-
        A single timestamped summary of one network: every venue's liveness,
        AMM pool reserves (TVL), 24h traded volume, the busiest pairs, stablecoin
        peg readings and how fresh the underlying data is. All figures are read
        in one consistent database statement, so `asOf` is a real instant and
        every age is measured from it. Missing data is reported as `null` with a
        reason (or an empty list), never invented — a cross-pair volume total is
        only returned when the pairs share one unit. Responses are cached briefly
        per network; `cache.ageSeconds` states the age of a served copy.
      security: []
      parameters:
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Network snapshot
          headers:
            Cache-Control:
              schema:
                type: string
              description: Freshness/brief-caching policy for the snapshot.
            X-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
              description: Whether this response came from the short-lived cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /price/{assetA}/{assetB}:
    get:
      operationId: getPrice
      summary: Get aggregated price for a pair
      security:
        - x402: []
      parameters:
        - name: assetA
          in: path
          required: true
          schema:
            type: string
          example: XLM
        - name: assetB
          in: path
          required: true
          schema:
            type: string
          example: USDC
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Aggregated price data
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedPrice'
              example:
                assetA: XLM
                assetB: USDC
                pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                network: testnet
                price: 0.11906825
                sdexPrice: 0.11906825
                ammPrice: 0.12
                volume24h: 184400
                sdexVolume24h: 134800
                ammVolume24h: 49600
                vwap1m: 0.11906825
                vwap5m: 0.11906825
                vwap1h: 0.11906825
                vwap24h: 0.11906825
                priceChange24h: 0.42
                sources: 2
                confidence: high
                lastTradeAgeSeconds: 30
                stale: false
                bestRoute: SPLIT
                lastUpdated: '2026-10-16T00:00:00.000Z'
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /price/{assetA}/{assetB}/route:
    get:
      operationId: getBestRoute
      summary: Get best swap route for a pair and amount
      security:
        - x402: []
      parameters:
        - name: assetA
          in: path
          required: true
          schema:
            type: string
        - name: assetB
          in: path
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: number
            default: 1000
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Best route information
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteInfo'
              example:
                route: SPLIT
                sdexPrice: 0.11906825
                ammPrice: 0.12
                estimatedOutput: 119.07
                slippagePct: 0.08
                recommendation: Split across SDEX and AMM
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /price/{assetA}/{assetB}/history:
    get:
      operationId: getPriceHistory
      summary: Get price history buckets
      security: []
      parameters:
        - name: assetA
          in: path
          required: true
          schema:
            type: string
        - name: assetB
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [1m, 5m, 1h, 24h]
            default: 1h
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Price history
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairKey:
                    type: string
                  network:
                    type: string
                    enum: [testnet, mainnet]
                  window:
                    type: string
                  buckets:
                    type: array
                    items:
                      $ref: '#/components/schemas/PriceBucket'
              example:
                pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                network: testnet
                window: 1h
                buckets:
                  - bucket: '2026-10-16T00:00:00.000Z'
                    window: 1h
                    vwap: 0.11906825
                    sdexVwap: 0.11906825
                    ammVwap: 0.12
                    volume: 5200
                    tradeCount: 3
                    open: 0.1189
                    close: 0.1191
                    high: 0.1192
                    low: 0.1188
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /pools:
    get:
      operationId: getPools
      summary: Get AMM liquidity pool reserves and spot prices
      security:
        - x402: []
      parameters:
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: List of pools
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    items:
                      type: object
                      properties:
                        pool_id:
                          type: string
                        asset_a:
                          type: string
                        asset_b:
                          type: string
                        reserve_a:
                          type: number
                        reserve_b:
                          type: number
                        spot_price:
                          type: number
                        fee_bp:
                          type: integer
                        timestamp:
                          type: string
                          format: date-time
              example:
                pools:
                  - pool_id: 65c24738ce0ba076fd4f4d3b66618681ca1f9e9d78c95bb8db3a684a82bb3ee0
                    asset_a: XLM
                    asset_b: USDC
                    reserve_a: 550000
                    reserve_b: 66000
                    spot_price: 0.12
                    fee_bp: 30
                    timestamp: '2026-10-16T00:00:00.000Z'
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /candles/{assetA}/{assetB}:
    get:
      operationId: getCandles
      summary: Get OHLCV candle data
      security:
        - x402: []
      parameters:
        - name: assetA
          in: path
          required: true
          schema:
            type: string
        - name: assetB
          in: path
          required: true
          schema:
            type: string
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h, 1d]
            default: 1h
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Candle data
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairKey:
                    type: string
                  network:
                    type: string
                    enum: [testnet, mainnet]
                  interval:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  candles:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        open:
                          type: number
                        high:
                          type: number
                        low:
                          type: number
                        close:
                          type: number
                        volume:
                          type: number
              example:
                pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                network: testnet
                interval: 1h
                from: '2026-10-15T00:00:00.000Z'
                to: '2026-10-16T00:00:00.000Z'
                candles:
                  - time: '2026-10-16T00:00:00.000Z'
                    open: 0.1189
                    high: 0.1192
                    low: 0.1188
                    close: 0.1191
                    volume: 5200
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /prices/history:
    get:
      operationId: getPriceSnapshots
      summary: Get historical 1-minute price snapshots
      description: >-
        Returns minute-resolution price snapshots for a pair over [from, to],
        optionally aggregated into 5m or 1h buckets. Snapshots are retained for
        ~30 days. Gated by x402 (matches the /price prefix).
      security:
        - x402: []
      parameters:
        - name: pair
          in: query
          required: true
          schema:
            type: string
          example: XLM/USDC
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum: [1m, 5m, 1h]
            default: 1m
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          required: false
          description: >-
            Response encoding. `csv` returns a text/csv body holding a
            `ts,price,volume` table (RFC 4180 quoting, LF line endings, one
            trailing newline); `json` is the default.
          schema:
            type: string
            enum: [json, csv]
            default: json
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Historical price snapshots
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/csv:
              schema:
                type: string
                example: "ts,price,volume\n2025-01-01T00:00:00.000Z,1.25,500\n"
            application/json:
              schema:
                type: object
                properties:
                  pair:
                    type: string
                  network:
                    type: string
                    enum: [testnet, mainnet]
                  interval:
                    type: string
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  count:
                    type: integer
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        ts:
                          type: string
                          format: date-time
                        price:
                          type: number
                        volume:
                          type: number
              example:
                pair: XLM/USDC
                network: testnet
                interval: 5m
                from: '2026-10-16T00:00:00.000Z'
                to: '2026-10-16T00:15:00.000Z'
                count: 3
                points:
                  - ts: '2026-10-16T00:00:00.000Z'
                    price: 0.4123
                    volume: 5400
                  - ts: '2026-10-16T00:05:00.000Z'
                    price: 0.4131
                    volume: 4980.5
                  - ts: '2026-10-16T00:10:00.000Z'
                    price: 0.4127
                    volume: 6120
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /pairs:
    get:
      operationId: listPairs
      summary: List all active trading pairs
      security: []
      parameters:
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: List of pairs
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairs:
                    type: array
                    items:
                      type: object
                      properties:
                        pairKey:
                          type: string
                        assetA:
                          $ref: '#/components/schemas/Asset'
                        assetB:
                          $ref: '#/components/schemas/Asset'
                        latestPrice:
                          type: number
                          nullable: true
                        lastUpdated:
                          type: string
                          format: date-time
                          nullable: true
              example:
                pairs:
                  - pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                    assetA: { code: XLM, issuer: null }
                    assetB:
                      code: USDC
                      issuer: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                    latestPrice: 0.11906825
                    lastUpdated: '2026-10-16T00:00:00.000Z'
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: addPair
      summary: Add a new trading pair (Admin only)
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetA:
                  type: string
                  example: XLM
                assetB:
                  type: string
                  example: USDC:GBBD47...
      responses:
        '201':
          description: Pair added
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairKey:
                    type: string
                  assetA:
                    $ref: '#/components/schemas/Asset'
                  assetB:
                    $ref: '#/components/schemas/Asset'
              example:
                pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                assetA: { code: XLM, issuer: null }
                assetB:
                  code: USDC
                  issuer: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /price/{assetA}/{assetB}/depth:
    get:
      operationId: getDepth
      summary: Get order-book depth and execution slippage for a pair
      description: >-
        Simulates an order of `amount` units of assetA and returns the price
        ladder plus the execution price and slippage versus the spot price.
      security:
        - x402: []
      parameters:
        - name: assetA
          in: path
          required: true
          schema:
            type: string
          example: XLM
        - name: assetB
          in: path
          required: true
          schema:
            type: string
          example: USDC
        - name: amount
          in: query
          required: false
          schema:
            type: number
            default: 1000
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Depth ladder
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepthResponse'
              example:
                assetA: XLM
                assetB: USDC
                pairKey: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5/XLM
                spotPrice: 0.12
                executionPrice: 0.1199
                slippagePct: 0.08
                asks:
                  - { price: 0.1201, size: 5500 }
                  - { price: 0.1203, size: 11000 }
                bids:
                  - { price: 0.1199, size: 5500 }
                  - { price: 0.1197, size: 11000 }
                source: AMM
                captured: '2026-10-16'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /book/{assetA}/{assetB}:
    get:
      operationId: getBook
      summary: Get the aggregated SDEX and AMM price ladder for a pair
      description: >-
        Returns asks and bids as cumulative assetA size at each price. Live
        SDEX levels are reported as observed; AMM levels are synthetic,
        fee-adjusted reserve steps. `depth` is a fractional price distance
        around spot (default 0.1), and `step` is the fraction of each AMM
        reserve used per synthetic level (default 0.01). Per-venue sample
        counts, observation times, ages and availability are included.
      parameters:
        - name: assetA
          in: path
          required: true
          schema:
            type: string
          description: Base asset; use XLM for native Stellar or CODE:ISSUER for a token.
          example: XLM
        - name: assetB
          in: path
          required: true
          schema:
            type: string
          description: Quote asset; token issuers must be supplied in full.
          example: USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        - name: depth
          in: query
          required: false
          description: Maximum fractional distance from spot; valid range 0 to 0.5.
          schema:
            type: number
            minimum: 0
            maximum: 0.5
            default: 0.1
        - name: step
          in: query
          required: false
          description: AMM input-reserve fraction per synthetic rung; valid range 0.001 to 0.1.
          schema:
            type: number
            minimum: 0.001
            maximum: 0.1
            default: 0.01
        - $ref: '#/components/parameters/NetworkQuery'
      responses:
        '200':
          description: Book levels with per-venue provenance; unavailable venues are identified in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Invalid asset, depth, or step parameter
        '503':
          description: No source could be read; response provenance identifies failed venues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

